<ng-container *transloco="let t; prefix: 'meta-api-connections'">
  <p>{{t('description')}}</p>
  <section class="card" aria-labelledby="comicvine-connection-heading">
    <div class="card-header">
      <h3 id="comicvine-connection-heading" class="h5 mb-0">Comic Vine</h3>
    </div>
    <div class="card-body">
      <app-manage-comicvine />
    </div>
  </section>
  <section class="card mt-3" aria-labelledby="gcd-heading">
    <div class="card-header"><h3 id="gcd-heading" class="h5 mb-0">Grand Comics Database (GCD)</h3></div>
    <div class="card-body"><app-manage-gcd /></div>
  </section>
</ng-container>
